name: Deploy AutoMinds Spaces to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build static 3D viewer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout viewer
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify S1 site layout geometry
        run: npm run test:site
      - name: Verify transparent glazing and navigation barriers
        run: npm run test:windows
      - name: Verify reversible window aperture cuts
        run: npm run test:apertures
      - name: Verify source geometry and scene integrity
        run: npm run test:scene
      - name: Verify source-based stair guards and safe floor egress
        run: npm run test:stairs
      - name: Build public GitHub Pages site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_PUBLIC_PREVIEW: 'true'
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
