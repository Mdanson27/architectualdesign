name: Phase 14D kitchen validation
on:
  pull_request:
    paths:
      - 'src/phase2/phase14d-source-replacement.js'
      - 'src/phase2/stage3-kitchen-system.js'
      - 'src/phase2/actual-house.js'
      - 'tests/verify-phase14d-source-kitchen.mjs'
      - '.github/workflows/phase14d-kitchen.yml'
jobs:
  kitchen-source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/verify-phase14d-source-kitchen.mjs
      - run: npm run test:stage3
      - run: npm run test:production
      - run: npm run build
      - name: Real browser regression
        env:
          QA_ALL_DOORS: '1'
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase14d-browser-evidence
          path: |
            architecture-browser-qa.json
            analysis/
