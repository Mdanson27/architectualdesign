<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Phase 15E isolated architectural finishes review</title><style>body{margin:0;background:#e9e3da;font:14px system-ui}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
import {createPhase15Finishes,finishesStats,FINISHES15} from './src/phase2/phase15-finishes.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1000,740);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);

let current;
window.__FinishesQA={ids:Object.keys(FINISHES15),render(id,detail,view){
 if(current){scene.remove(current);current.userData.dispose();}

  const views={front:[[0,1.25,-4.9],[0,1.22,0]],perspective:[[1.7,1.45,-4.5],[0,1.22,0]],detail:[[.15,1.48,-1.6],[.15,1.48,0]],ceiling:[[-1.1,2.18,-2.2],[-.2,2.03,0]]};
  const [eye,target]=views[view];camera.position.set(...eye);camera.lookAt(...target);
 }else{
  const views={front:[[0,1.38,-5.3],[0,1.35,.15]],perspective:[[2.65,1.62,-4.6],[0,1.30,.25]],detail:[[.05,.72,-1.2],[0,.28,.62]],ceiling:[[0,1.24,-1.4],[0,2.60,.45]]};

 }

 const counts=new Set();for(let i=0;i<pixels.length;i+=64)counts.add((pixels[i]<<16)|(pixels[i+1]<<8)|pixels[i+2]);

</script></body></html>
